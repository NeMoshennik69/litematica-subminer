plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
}

version = "1.0.0"
group = "com.example.litematicaaddon"

repositories {
    maven { url = "https://shedaniel.me" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    mappings "net.fabricmc.yarn:26.3+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
    
    // Официальные модули Fabric API под версию 26.3
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.105.0+26.3"

    // Подключение Litematica и MaLiLib под версию 26.3
    modImplementation "curse.maven:litematica-308892:5901234"
    modImplementation "curse.maven:malilib-330260:5901230"
    
    // Встроенный навигатор Baritone API
    implementation 'com.github.cabaletta:baritone:1.3.0'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
